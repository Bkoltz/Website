name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:
  # Called by sync-discord.yml: a push made with the default GITHUB_TOKEN does
  # not trigger other workflows, so the sync job invokes this one directly.
  workflow_call:
    secrets:
      DISCORD_ARCHIVE_KEY:
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.23.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build gallery
        run: |
          pip install Pillow requests cryptography
          python scripts/build_gallery.py

      # Refreshes data/github_stats.json for the home page panel. GITHUB_TOKEN
      # lifts the API rate limit from 60/hour to 5000/hour. The script keeps the
      # committed values and exits 0 if GitHub is unreachable, so a rate limit
      # or an outage never fails the deploy.
      - name: Refresh GitHub stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_stats.py

      # Decrypts data/discord.sql.enc in-process; without the key this writes
      # an empty help section rather than failing the whole deploy.
      - name: Build help pages
        env:
          DISCORD_ARCHIVE_KEY: ${{ secrets.DISCORD_ARCHIVE_KEY }}
        run: python scripts/build_help_pages.py

      - name: Build with Zola
        run: zola build

      # Builds the static search index from the rendered HTML into public/pagefind/.
      # Must run after zola build and before the artifact upload, or the help
      # search box stays hidden in production.
      - name: Build search index
        run: npx --yes pagefind@1 --site public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
